theme: jekyll-theme-hacker
title: ZeroYaHero
description: Software, tech art, and design portfolio.

# Canonical host. jekyll-seo-tag and jekyll-sitemap need this to build
# absolute URLs. Without it, canonical tags and the sitemap are wrong.
url: https://zeroyahero.com
baseurl: ""
lang: en-US

# Fed to the Person schema that jekyll-seo-tag writes on the home page.
author: ZeroYaHero
logo: /assets/brand/T_ZeroFaceLogo.png
image: /assets/brand/T_ZeroBanner.png

# "sameAs" in the schema. It tells Google that these accounts and this
# site are one identity, which is what a brand-name search depends on.
social:
  name: ZeroYaHero
  links:
    - https://x.com/ZeroYaHero
    - https://github.com/ZeroYaHero
    - https://www.linkedin.com/in/ellisfitz/

# Logo shown at the top of every page. Comment out to hide it.
header_logo: /assets/brand/T_ZeroFaceLogo.png

# Page background image. Comment out background_image to turn it off.
# opacity 0 = invisible, 1 = full strength.
# size: "auto 100%" fills the height, width scales with it.
#       cover fills both and crops. contain fits the whole image in.
# position: left, right, center, or a pair like "left top".
# repeat: no-repeat, repeat, repeat-x, repeat-y.
background_image: /assets/brand/T_ZeroBackground.png
background_opacity: 0.05
background_size: auto 100%
background_position: left center
background_repeat: no-repeat

# Buttons in the site header. Order is the order shown.
# icon must match a {% when %} branch in _includes/icon.html
header_links:
  - name: X
    url: https://x.com/ZeroYaHero
    icon: x
  - name: GitHub
    url: https://github.com/ZeroYaHero
    icon: github
  - name: Email
    url: mailto:zeroyaheroofficial@gmail.com
    icon: email
  - name: LinkedIn
    url: https://www.linkedin.com/in/ellisfitz/
    icon: linkedin

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
