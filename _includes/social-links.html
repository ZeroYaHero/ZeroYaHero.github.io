{% if site.header_links %}
<div class="social-links" aria-label="Social and contact links">
  {% for link in site.header_links %}
  <a class="btn" href="{{ link.url }}"{% unless link.url contains "mailto:" %} target="_blank" rel="noopener"{% endunless %}>
    <span class="icon">{% include icon.html name=link.icon %}</span>{{ link.name }}
  </a>
  {% endfor %}
</div>
{% endif %}
