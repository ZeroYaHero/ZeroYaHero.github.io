<!-- Image control lives in /robots.txt, which permits the logo and blocks the rest.
     "noimageindex" is absent on purpose: it would suppress the logo too. -->
<meta name="robots" content="index, follow, max-image-preview:standard">

<!-- Favicon. 192x192 is a multiple of 48, which is what Google asks for. -->
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/brand/T_ZeroFaceLogo.png' | relative_url }}">
<link rel="shortcut icon" type="image/png" href="{{ '/assets/brand/T_ZeroFaceLogo.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/brand/T_ZeroFaceLogo.png' | relative_url }}">
